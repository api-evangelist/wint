aid: wint
name: WINT
description: >-
  WINT (also styled Wint) is an AI-powered water management and leak-detection
  platform for commercial and industrial facilities. Its IoT flow sensors,
  automated shut-off valves, and 24/7 staffed monitoring center use signal
  processing and anomaly detection to catch leaks in real time across main
  feeds, domestic cold and hot water, HVAC loops, cooling towers, and
  irrigation systems, reporting 20-25% average water-consumption reduction and
  up to 90% less water damage and insurance loss. WINT is backed by Insight
  Partners and carries NSF International, ISO, and USGBC affiliations. During
  enrichment no public developer API, documentation, well-known discovery
  surface, OpenAPI, or SDK was found; this profile captures the company's
  public web properties and a live domain-security probe.
